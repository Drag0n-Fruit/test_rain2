name: Build Mod Jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 설정 (자동 설치+캐싱)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 빌드
        run: gradle build --stacktrace

      - name: 결과 jar 업로드
        uses: actions/upload-artifact@v4
        with:
          name: raincraft-jar
          path: build/libs/*.jar
