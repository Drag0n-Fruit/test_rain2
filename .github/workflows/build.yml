name: Build Mod Jar

on:
  push:
  workflow_dispatch: # Actions 탭에서 수동으로도 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Wrapper 생성 (없으면)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew 없음 - wrapper 새로 생성"
            curl -s https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
            unzip -q gradle.zip
            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: 빌드
        run: ./gradlew build --stacktrace

      - name: 결과 jar 업로드
        uses: actions/upload-artifact@v4
        with:
          name: raincraft-jar
          path: build/libs/*.jar
